<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Backup icon concept: layered records around a violet central mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#302746"/>
      <stop offset="1" stop-color="#171325"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E3DAF4"/>
      <stop offset="1" stop-color="#B9ACD8"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/>
  <!-- Offset leaves suggest separate pieces of work gathering into one record. -->
  <rect x="126" y="145" width="225" height="225" rx="38" transform="rotate(-16 238.5 257.5)" fill="#594A7A"/>
  <rect x="151" y="125" width="225" height="225" rx="38" transform="rotate(13 263.5 237.5)" fill="#8F7BB5"/>
  <rect x="148" y="148" width="216" height="216" rx="38" fill="url(#paper)"/>
  <rect x="218" y="218" width="76" height="76" rx="19" fill="#8567B7"/>
  <rect x="233" y="231" width="46" height="46" rx="13" fill="#D1B8F2" opacity=".7"/>
</svg>
